[package]
name = "darkboard"
version = "0.1.2"
description = "A native infinite whiteboard in Rust: dark canvas, one smooth white marker."
edition = "2024"
repository = "https://github.com/makasDev/darkboard"
license-file = "LICENSE"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
